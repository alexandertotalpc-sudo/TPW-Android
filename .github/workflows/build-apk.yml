name: Build TPW APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
   
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses


      - name: Extract TPW project
        run: unzip -o TPW_Android_v3_para_compilar_desde_celular.zip -d .

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: cd TPW_Android_v3 && gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TPW-debug-APK
          path: TPW_Android_v3/app/build/outputs/apk/debug/app-debug.apk
